name: Validar arquitectura y compatibilidad
on:
  pull_request:
  push:
    branches: [testing, main, Public]

permissions:
  contents: read

jobs:
  backend-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip setuptools
      - run: python -m pip install -r backend/requirements-test.txt pip-audit
      - run: python -m pip_audit
      - run: python -m pytest backend/tests/test_access_control.py backend/tests/test_sftp_listing.py backend/tests/test_jwt_validation.py -q

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend-web/package-lock.json
      - run: npm ci
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: '1'

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend-desktop-ui/package-lock.json
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install asyncssh==2.24.1
      - run: npm ci
        working-directory: frontend-desktop-ui
      - run: npm run build
        working-directory: frontend-desktop-ui
      - run: npm test
        working-directory: frontend-desktop-ui
      - run: dotnet build apps/windows/AiSysadmin.csproj -c Release
      - run: dotnet test apps/windows.Tests/AiSysadmin.Tests.csproj -c Release
        env:
          AI_AGENT_SSH_LAB_PYTHON: python

  docker-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validar configuración con una plantilla sin secretos reales
        run: |
          cp .env.prod.template .env.prod
          docker compose --env-file .env.prod -f docker-compose.prod.yml config --quiet
