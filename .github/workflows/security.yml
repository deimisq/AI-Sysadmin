name: Revisar secretos y dependencias

on:
  push:
    branches: [testing]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '23 9 * * 1'

permissions:
  contents: read

jobs:
  secretos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Comprobar secretos sin imprimir valores
        shell: bash
        run: |
          set -euo pipefail
          version=8.30.1
          archive="gitleaks_${version}_linux_x64.tar.gz"
          base="https://github.com/gitleaks/gitleaks/releases/download/v${version}"
          folder="$(mktemp -d)"
          curl --fail --location --proto '=https' "$base/$archive" -o "$folder/$archive"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $archive" > "$folder/checksums.txt"
          (cd "$folder" && sha256sum --check --strict checksums.txt)
          tar -xzf "$folder/$archive" -C "$folder" gitleaks
          "$folder/gitleaks" git . --redact --log-opts='--all' --no-banner

  dependencias-interfaz:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        carpeta: [frontend-desktop-ui, frontend-web]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar y revisar dependencias
        working-directory: ${{ matrix.carpeta }}
        run: |
          npm ci
          npm audit

  dependencias-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Revisar dependencias directas y transitivas
        shell: pwsh
        run: |
          dotnet restore apps/windows.Tests/AiSysadmin.Tests.csproj -p:NuGetAudit=true -p:NuGetAuditMode=all -p:WarningsAsErrors=NU1900%3BNU1901%3BNU1902%3BNU1903%3BNU1904%3BNU1905 --force
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
