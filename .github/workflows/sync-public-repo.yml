name: Sync to Public Repository

on:
  push:
    branches:
      - Public

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Public branch
        uses: actions/checkout@v4
        with:
          ref: Public
          fetch-depth: 0

      - name: Push to Public Repository
        run: |
          # Configurar git
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"
          
          # Añadir remoto público con autenticación
          # Se usa un secreto para el token de acceso
          git remote add public_repo https://oauth2:${{ secrets.PUBLIC_REPO_TOKEN }}@github.com/sentrait/ai_agent_public.git
          
          # Push forzado a la rama main del repo público
          git push public_repo Public:main --force
