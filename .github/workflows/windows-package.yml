name: Build and release Windows installers
on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: windows-latest
    timeout-minutes: 45
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - name: Identify this build
        id: version
        shell: pwsh
        run: |
          $base = ([xml](Get-Content apps/windows/AiSysadmin.csproj -Raw)).Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1
          $parts = $base.Split('.')
          $version = "$($parts[0]).$($parts[1]).$env:GITHUB_RUN_NUMBER"
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=windows-$version" >> $env:GITHUB_OUTPUT
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend-desktop-ui/package-lock.json
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install asyncssh==2.24.1
      - run: npm ci
        working-directory: frontend-desktop-ui
      - run: npm test
        working-directory: frontend-desktop-ui
      - run: dotnet test apps/windows.Tests/AiSysadmin.Tests.csproj -c Release
        env:
          AI_AGENT_SSH_LAB_PYTHON: python
          DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      - name: Prepare verified Inno Setup compiler
        shell: pwsh
        run: |
          $installer = Join-Path $env:RUNNER_TEMP 'innosetup-6.7.3.exe'
          Invoke-WebRequest 'https://github.com/jrsoftware/issrc/releases/download/is-6_7_3/innosetup-6.7.3.exe' -OutFile $installer
          $signature = Get-AuthenticodeSignature -LiteralPath $installer
          if ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.Subject -notmatch 'Pyrsys') { throw 'Unexpected compiler signature' }
          $compilerDir = Join-Path $env:RUNNER_TEMP 'inno'
          $process = Start-Process $installer -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/CURRENTUSER','/NOICONS',"/DIR=$compilerDir" -WindowStyle Hidden -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw 'Compiler setup failed' }
          "INNO_COMPILER=$compilerDir\ISCC.exe" >> $env:GITHUB_ENV
      - name: Build portable ZIP and per-user installer
        shell: pwsh
        env:
          PACKAGE_VERSION: ${{ steps.version.outputs.version }}
        run: ./scripts/package-windows.ps1 -Iscc $env:INNO_COMPILER -PackageVersion $env:PACKAGE_VERSION
      - name: Install WebView2 runtime for installation tests
        shell: pwsh
        run: |
          $installer = Join-Path $env:RUNNER_TEMP 'MicrosoftEdgeWebview2Setup.exe'
          Invoke-WebRequest 'https://go.microsoft.com/fwlink/p/?LinkId=2124703' -OutFile $installer
          $signature = Get-AuthenticodeSignature -LiteralPath $installer
          if ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.Subject -notmatch 'Microsoft Corporation') { throw 'Unexpected WebView2 signature' }
          $process = Start-Process $installer -ArgumentList '/silent','/install' -WindowStyle Hidden -Wait -PassThru
          if ($process.ExitCode -notin @(0,3010)) { throw "WebView2 setup failed: $($process.ExitCode)" }
      - name: Verify package and isolated installation
        shell: pwsh
        env:
          PACKAGE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          ./scripts/test-windows-package.ps1 -PackageDirectory "dist/windows/$env:PACKAGE_VERSION" -TestRoot "$env:RUNNER_TEMP/pkg" -ExerciseInstaller
      - name: Installation diagnostics
        if: failure()
        shell: pwsh
        run: |
          Get-ChildItem "$env:RUNNER_TEMP/pkg" -Filter install.log -Recurse -ErrorAction SilentlyContinue | ForEach-Object {
            Select-String -LiteralPath $_.FullName -Pattern 'error|exception|failed|abort|cancel|Unable' -Context 3,5
            Get-Content -LiteralPath $_.FullName -Tail 5
          }
      - name: Verify closing an older version on upgrade
        shell: powershell
        run: ./scripts/test-installer-upgrade.ps1 -Iscc $env:INNO_COMPILER
      - name: Verify installing before an approved restart
        shell: powershell
        run: ./scripts/test-installer-upgrade.ps1 -Iscc $env:INNO_COMPILER -KeepOldRunning -Language english
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installers
          path: |
            dist/windows/*/*.zip
            dist/windows/*/*.exe
            dist/windows/*/SHA256SUMS.txt
            dist/windows/*/RELEASE_NOTES.md
          if-no-files-found: error
          retention-days: 14

  release:
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: windows-installers
          path: release-assets
      - name: Publish verified installers
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_VERSION: ${{ needs.package.outputs.version }}
          RELEASE_TAG: ${{ needs.package.outputs.tag }}
          SOURCE_SHA: ${{ github.sha }}
          SOURCE_REF: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' checksum_files < <(find release-assets -name SHA256SUMS.txt -print0)
          test "${#checksum_files[@]}" -eq 1
          asset_dir="$(dirname "${checksum_files[0]}")"
          (cd "$asset_dir" && sha256sum --check SHA256SUMS.txt)
          printf 'Compilación automática de Windows x64.\n\nRama: `%s`\nCommit: `%s`\n\nDescargá el instalador `*-setup.exe` o el ZIP portable. Incluye el runtime .NET y requiere WebView2 Runtime. Esta compilación de prueba no está firmada.\n' "$SOURCE_REF" "$SOURCE_SHA" > release-notes.md
          if [[ -f "$asset_dir/RELEASE_NOTES.md" ]]; then printf '\n' >> release-notes.md; cat "$asset_dir/RELEASE_NOTES.md" >> release-notes.md; fi
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then echo "Release already published; keeping immutable assets."; exit 0; fi
          release_flags=(--prerelease --latest=false)
          if [[ "$SOURCE_REF" == "testing" ]]; then release_flags=(--latest); fi
          gh release create "$RELEASE_TAG" "$asset_dir"/*.exe "$asset_dir"/*.zip "$asset_dir"/SHA256SUMS.txt \
            --target "$SOURCE_SHA" --title "Windows $RELEASE_VERSION" \
            --notes-file release-notes.md "${release_flags[@]}"
          printf '### Descargas\n\n[Windows %s](https://github.com/%s/releases/tag/%s)\n' "$RELEASE_VERSION" "$GH_REPO" "$RELEASE_TAG" >> "$GITHUB_STEP_SUMMARY"
