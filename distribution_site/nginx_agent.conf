server {
    listen 8080;
    server_name agent.sentrait.com.uy;
    
    root /var/www/agent;
    index index.html;
    
    # Logs
    access_log /var/log/nginx/agent.sentrait.access.log;
    error_log /var/log/nginx/agent.sentrait.error.log;
    
    # License API proxy
    location /api/v1/license/ {
        proxy_pass http://127.0.0.1:5000/api/v1/license/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # CORS headers
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Content-Type, Authorization" always;
        
        if ($request_method = 'OPTIONS') {
            return 204;
        }
    }
    
    # Health check for license server
    location /health {
        proxy_pass http://127.0.0.1:5000/health;
        proxy_http_version 1.1;
    }
    
    # Main location
    location / {
        try_files $uri $uri/ =404;
    }
    
    # Download file with proper headers
    location /ai-sysadmin-release.tar.gz {
        add_header Content-Type application/gzip;
        add_header Content-Disposition 'attachment; filename="ai-sysadmin-release.tar.gz"';
        add_header X-Content-Type-Options nosniff;
    }
    
    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    
    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
}
