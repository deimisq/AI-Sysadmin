version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: sysadmin-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sysadmin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-sysadmin_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - sysadmin-network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sysadmin}" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend (Compiled Binary)
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: sysadmin-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-sysadmin}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-sysadmin_db}
      SECRET_KEY: ${SECRET_KEY}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      SMTP_SERVER: ${SMTP_SERVER:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL:-}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000}
    networks:
      - sysadmin-network
    healthcheck:
      test: [ "CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8000/health || exit 1" ]
      interval: 30s
      timeout: 10s
      retries: 3

  # Frontend (Next.js Standalone)
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: sysadmin-frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/api/v1}
    networks:
      - sysadmin-network

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: sysadmin-nginx
    restart: unless-stopped
    depends_on:
      - frontend
      - backend
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    networks:
      - sysadmin-network
    healthcheck:
      test: [ "CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost/health || exit 1" ]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  sysadmin-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
