version: '3.8'

services:
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d
      - ./nginx/ssl:/etc/nginx/ssl
    depends_on:
      - frontend
      - backend
    restart: always
    networks:
      - sysadmin-network

  db:
    image: pgvector/pgvector:pg15
    environment:
      POSTGRES_USER: sysadmin
      POSTGRES_PASSWORD: SecurePasse6ab2dd2
      POSTGRES_DB: sysadmin_db
    # Ports removed to secure DB, only accessible within docker network
    # ports:
    #   - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - sysadmin-network

  backend:
    build: ./backend
    working_dir: /app
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./backend:/app
      - /home/ubuntu/.ssh:/home/ubuntu/.ssh:ro
    # Port 8000 is no longer exposed to host, only to Nginx
    expose:
      - "8000"
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql://sysadmin:SecurePasse6ab2dd2@db:5432/sysadmin_db
    depends_on:
      - db
    networks:
      - sysadmin-network

  frontend:
    build: ./frontend-web
    # Port 3000 is no longer exposed to host, only to Nginx
    expose:
      - "3000"
    # Commented out bind mount to use built-in node_modules
    # volumes:
    #   - ./frontend:/app
    #   - /app/node_modules
    environment:
      # Now API is available at the same domain via /api/v1
      # Client-side requests go to https://domain.com/api/v1
      - NEXT_PUBLIC_API_URL=/api/v1
    depends_on:
      - backend
    restart: always
    networks:
      - sysadmin-network

networks:
  sysadmin-network:
    external: true
    name: ai_agent_sysadmin-network

volumes:
  postgres_data:
