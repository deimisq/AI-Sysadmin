[package]
name = "ai-sysadmin-desktop"
version = "2.0.0"
description = "AI Sysadmin Agent Desktop Application"
authors = ["AI Sysadmin Team"]
edition = "2021"

[[bin]]
name = "ai-sysadmin-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
# Tauri core
tauri = { version = "2.0", features = [] }
tauri-plugin-shell = "2.0"
tauri-plugin-http = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# SSH functionality
russh = "0.45"
russh-keys = "0.45"
async-trait = "0.1"
tokio = { version = "1.35", features = ["full"] }
# russh-sftp = "2.0"

# Credential encryption
argon2 = "0.5"
chacha20poly1305 = "0.10"
rand = "0.8"

# Local database
rusqlite = { version = "0.30", features = ["bundled"] }

# Utilities
uuid = { version = "1.6", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1.0"
thiserror = "1.0"
portable-pty = "0.8"

[profile.dev]
incremental = true    # Re-enable incremental compilation for speed
codegen-units = 256   # Keep splitting to manage peak RAM
opt-level = 0
debug = false

[profile.release]
panic = "abort"
codegen-units = 1     # Keep this for final binary size, but use Jobs=1 in CI
lto = true
opt-level = "z"
strip = true
