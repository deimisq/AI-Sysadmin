<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Sysadmin Agent</title>
    <style>
        body,
        html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        #loader {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #0a0a0a;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            color: white;
            font-family: system-ui, -apple-system, sans-serif;
            z-index: 9999;
        }

        .spinner {
            width: 50px;
            height: 50px;
            border: 4px solid #333;
            border-top-color: #3b82f6;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        #loader p {
            margin-top: 20px;
            font-size: 14px;
            color: #888;
        }
    </style>
</head>

<body>
    <div id="loader">
        <div class="spinner"></div>
        <p>Cargando AI Sysadmin Agent...</p>
    </div>

    <iframe id="app-frame" src="https://testing.sentrait.com.uy"
        allow="clipboard-read; clipboard-write; fullscreen; geolocation; microphone; camera"
        onload="document.getElementById('loader').style.display='none';"></iframe>

    <script>
        // Hide loader after max 5 seconds even if iframe doesn't load
        setTimeout(() => {
            document.getElementById('loader').style.display = 'none';
        }, 5000);

        // Detect if offline
        window.addEventListener('offline', () => {
            document.getElementById('loader').innerHTML = `
                <div style="text-align: center;">
                    <h2>Sin Conexión</h2>
                    <p>No se puede conectar a testing.sentrait.com.uy</p>
                    <p>Verifica tu conexión a internet</p>
                </div>
            `;
            document.getElementById('loader').style.display = 'flex';
        });

        window.addEventListener('online', () => {
            location.reload();
        });
    </script>
</body>

</html>
