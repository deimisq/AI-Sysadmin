<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Sysadmin Agent</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body,
        html {
            width: 100%;
            height: 100%;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0a0a0a;
            color: white;
        }

        .container {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: #1a1a1a;
            border: 1px solid #2a2a2a;
            border-radius: 12px;
            padding: 48px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
            text-align: center;
            max-width: 420px;
            width: 90%;
        }

        .logo {
            width: 64px;
            height: 64px;
            margin: 0 auto 24px;
            background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
        }

        h1 {
            color: #ffffff;
            margin-bottom: 8px;
            font-size: 24px;
            font-weight: 600;
        }

        p {
            color: #888;
            margin-bottom: 32px;
            line-height: 1.5;
            font-size: 14px;
        }

        .button {
            background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
            color: white;
            border: none;
            padding: 14px 32px;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            width: 100%;
        }

        .button:hover:not(:disabled) {
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.4);
        }

        .button:active:not(:disabled) {
            transform: translateY(0);
        }

        .button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .status {
            margin-top: 20px;
            padding: 12px;
            border-radius: 6px;
            font-size: 13px;
            display: none;
        }

        .status.info {
            display: block;
            background: #1e3a5f;
            color: #60a5fa;
            border: 1px solid #2563eb;
        }

        .status.success {
            display: block;
            background: #1e3a1e;
            color: #4ade80;
            border: 1px solid #22c55e;
        }

        .spinner {
            display: inline-block;
            width: 14px;
            height: 14px;
            border: 2px solid #3b82f6;
            border-top-color: transparent;
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
            margin-right: 8px;
            vertical-align: middle;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        #app-frame {
            width: 100%;
            height: 100%;
            border: none;
            position: absolute;
            top: 0;
            left: 0;
            display: none;
            background: #0a0a0a;
        }

        #app-frame.active {
            display: block;
        }

        .help-text {
            margin-top: 16px;
            font-size: 12px;
            color: #666;
        }
    </style>
</head>

<body>
    <div class="container" id="login-screen">
        <div class="logo">🔐</div>
        <h1>AI Sysadmin Agent</h1>
        <p>Inicia sesión para acceder a la aplicación</p>
        <button class="button" id="login-btn" onclick="openLogin()">Abrir Inicio de Sesión</button>
        <div class="status info" id="status-info" style="display:none;">
            <span class="spinner"></span>
            <span id="status-text"></span>
        </div>
        <div class="status success" id="status-success" style="display:none;">
            ✓ Sesión iniciada correctamente
        </div>
        <p class="help-text">Se abrirá tu navegador para iniciar sesión</p>
    </div>

    <iframe id="app-frame" src="https://testing.sentrait.com.uy"></iframe>

    <script type="module">
        const { open } = window.__TAURI__.shell;

        const LOGIN_URL = 'https://testing.sentrait.com.uy/login';
        const API_BASE = 'https://testing.sentrait.com.uy/api/v1';

        let checkInterval = null;

        const loginBtn = document.getElementById('login-btn');
        const statusInfo = document.getElementById('status-info');
        const statusText = document.getElementById('status-text');
        const statusSuccess = document.getElementById('status-success');
        const loginScreen = document.getElementById('login-screen');
        const appFrame = document.getElementById('app-frame');

        console.log('🚀 Desktop app ready');

        // Check for session on startup
        checkSession();

        async function openLogin() {
            try {
                loginBtn.disabled = true;
                showStatus('Abriendo navegador...');

                // Open browser
                await open(LOGIN_URL);

                // Start checking for session
                showStatus('Esperando inicio de sesión...');
                startChecking();

            } catch (error) {
                console.error('Error:', error);
                alert('No se pudo abrir el navegador. Abre manualmente: ' + LOGIN_URL);
                loginBtn.disabled = false;
            }
        }

        function startChecking() {
            if (checkInterval) return;

            checkInterval = setInterval(() => {
                checkSession();
            }, 2000);
        }

        function stopChecking() {
            if (checkInterval) {
                clearInterval(checkInterval);
                checkInterval = null;
            }
        }

        async function checkSession() {
            try {
                const response = await fetch(`${API_BASE}/auth/me`, {
                    method: 'GET',
                    credentials: 'include',
                    headers: {
                        'Accept': 'application/json'
                    }
                });

                if (response.ok) {
                    const user = await response.json();
                    console.log('✓ Session active:', user.email);
                    onSessionActive();
                } else {
                    console.log('Waiting for session...');
                }
            } catch (error) {
                console.log('Checking...');
            }
        }

        function onSessionActive() {
            stopChecking();
            hideStatus();

            // Show success briefly
            statusSuccess.style.display = 'block';

            setTimeout(() => {
                loginScreen.style.display = 'none';
                appFrame.classList.add('active');
                console.log('✓ App loaded');
            }, 1000);
        }

        function showStatus(message) {
            statusInfo.style.display = 'block';
            statusSuccess.style.display = 'none';
            statusText.textContent = message;
        }

        function hideStatus() {
            statusInfo.style.display = 'none';
        }

        // Expose for debugging
        window.resetApp = () => {
            loginScreen.style.display = 'block';
            appFrame.classList.remove('active');
            statusInfo.style.display = 'none';
            statusSuccess.style.display = 'none';
            loginBtn.disabled = false;
            stopChecking();
        };
    </script>
</body>

</html>
