<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Sysadmin Agent</title>
    <style>
        body,
        html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        #loader {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #0a0a0a;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            color: white;
            font-family: system-ui, -apple-system, sans-serif;
            z-index: 9999;
        }

        .spinner {
            width: 50px;
            height: 50px;
            border: 4px solid #333;
            border-top-color: #3b82f6;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        #loader p {
            margin-top: 20px;
            font-size: 14px;
            color: #888;
        }

        #error {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: #1a1a1a;
            padding: 40px;
            border-radius: 10px;
            text-align: center;
            color: white;
            max-width: 500px;
            z-index: 10000;
        }

        #error h2 {
            color: #ef4444;
            margin-bottom: 10px;
        }

        #error button {
            margin-top: 20px;
            padding: 10px 20px;
            background: #3b82f6;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
        }

        #error button:hover {
            background: #2563eb;
        }
    </style>
</head>

<body>
    <div id="loader">
        <div class="spinner"></div>
        <p>Cargando AI Sysadmin Agent...</p>
    </div>

    <div id="error">
        <h2>Error al Cargar</h2>
        <p id="error-message"></p>
        <button onclick="location.reload()">Reintentar</button>
    </div>

    <iframe id="app-frame" src="https://testing.sentrait.com.uy"
        allow="clipboard-read; clipboard-write; fullscreen; geolocation"></iframe>

    <script>
        console.log('🚀 Desktop App Initialized');
        console.log('Target URL:', 'https://testing.sentrait.com.uy');

        const iframe = document.getElementById('app-frame');
        const loader = document.getElementById('loader');
        const errorDiv = document.getElementById('error');
        const errorMessage = document.getElementById('error-message');

        let loadTimeout;
        let iframeLoaded = false;

        // Track iframe load
        iframe.addEventListener('load', function () {
            console.log('✅ Iframe loaded');
            iframeLoaded = true;
            clearTimeout(loadTimeout);

            setTimeout(() => {
                loader.style.display = 'none';
            }, 500);

            // Try to inject API proxy script into iframe
            try {
                injectApiProxy();
            } catch (e) {
                console.warn('Could not inject proxy (CORS):', e.message);
                // This is expected for cross-origin iframes
            }
        });

        // Track iframe errors
        iframe.addEventListener('error', function (e) {
            console.error('❌ Iframe error:', e);
            showError('No se pudo cargar la aplicación. Verifica tu conexión a internet.');
        });

        // Timeout handler
        loadTimeout = setTimeout(() => {
            if (!iframeLoaded) {
                console.warn('⚠️ Load timeout');
                showError('La aplicación está tardando demasiado en cargar. Verifica tu conexión.');
            }
        }, 15000);

        function showError(message) {
            loader.style.display = 'none';
            errorMessage.textContent = message;
            errorDiv.style.display = 'block';
        }

        function injectApiProxy() {
            const iframeWindow = iframe.contentWindow;
            const iframeDocument = iframeWindow.document;

            // Only works if same-origin or CORS allows
            const script = iframeDocument.createElement('script');
            script.textContent = `
                console.log('🔧 API Proxy injected');
                
                // Store original fetch
                const originalFetch = window.fetch;
                
                // Override fetch to fix relative URLs
                window.fetch = function(url, options) {
                    let fixedUrl = url;
                    
                    // If URL is relative and starts with /api/v1
                    if (typeof url === 'string' && url.startsWith('/api/v1')) {
                        fixedUrl = 'https://testing.sentrait.com.uy' + url;
                        console.log('🔀 Proxied:', url, '→', fixedUrl);
                    }
                    
                    return originalFetch(fixedUrl, options);
                };
                
                console.log('✅ Fetch proxy active');
            `;
            iframeDocument.head.appendChild(script);
        }

        // Connection monitoring
        window.addEventListener('offline', () => {
            console.warn('📡 No connection');
            showError('Sin conexión a internet');
        });

        window.addEventListener('online', () => {
            console.log('📡 Connection restored');
            if (errorDiv.style.display === 'block') {
                location.reload();
            }
        });

        // Log errors
        window.addEventListener('error', function (e) {
            console.error('Window error:', e.error);
        });

        console.log('📝 App ready');
    </script>
</body>

</html>
