<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Sysadmin Agent</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body,
        html {
            width: 100%;
            height: 100%;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .container {
            background: white;
            border-radius: 20px;
            padding: 60px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            text-align: center;
            max-width: 500px;
        }

        .logo {
            width: 80px;
            height: 80px;
            margin: 0 auto 30px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
        }

        h1 {
            color: #2d3748;
            margin-bottom: 10px;
            font-size: 28px;
        }

        p {
            color: #718096;
            margin-bottom: 30px;
            line-height: 1.6;
        }

        .button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 16px 40px;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
        }

        .button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.6);
        }

        .button:active {
            transform: translateY(0);
        }

        .status {
            margin-top: 20px;
            padding: 12px;
            border-radius: 8px;
            font-size: 14px;
            display: none;
        }

        .status.checking {
            display: block;
            background: #fef3c7;
            color: #92400e;
        }

        .status.success {
            display: block;
            background: #d1fae5;
            color: #065f46;
        }

        .spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid #cbd5e0;
            border-top-color: #667eea;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-right: 8px;
            vertical-align: middle;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .hidden {
            display: none !important;
        }

        #app-frame {
            width: 100%;
            height: 100%;
            border: none;
            position: absolute;
            top: 0;
            left: 0;
            display: none;
        }

        #app-frame.active {
            display: block;
        }
    </style>
</head>

<body>
    <div class="container" id="login-screen">
        <div class="logo">🔐</div>
        <h1>Bienvenido a AI Sysadmin Agent</h1>
        <p>Para comenzar, necesitas iniciar sesión con tu cuenta</p>
        <button class="button" onclick="openBrowserLogin()">Iniciar Sesión en Navegador</button>
        <div class="status checking" id="status-checking">
            <span class="spinner"></span>
            Verificando sesión...
        </div>
        <div class="status success" id="status-success">
            ✅ Sesión detectada. Cargando aplicación...
        </div>
    </div>

    <iframe id="app-frame" src="https://testing.sentrait.com.uy"></iframe>

    <script>
        const LOGIN_URL = 'https://testing.sentrait.com.uy/login';
        const API_URL = 'https://testing.sentrait.com.uy/api/v1';
        const CHECK_INTERVAL = 2000; // Check every 2 seconds

        let checkingInterval = null;
        let sessionToken = localStorage.getItem('session_token');

        const loginScreen = document.getElementById('login-screen');
        const statusChecking = document.getElementById('status-checking');
        const statusSuccess = document.getElementById('status-success');
        const appFrame = document.getElementById('app-frame');

        console.log('🚀 Desktop App Initialized');

        // Check if already logged in
        if (sessionToken) {
            checkSession();
        }

        function openBrowserLogin() {
            console.log('🌐 Opening browser for login...');

            // Open system browser
            if (window.__TAURI__) {
                window.__TAURI__.shell.open(LOGIN_URL).catch(err => {
                    console.error('Failed to open browser:', err);
                    alert('No se pudo abrir el navegador. Por favor abre manualmente: ' + LOGIN_URL);
                });
            } else {
                window.open(LOGIN_URL, '_blank');
            }

            // Show checking status, hide success
            statusChecking.style.display = 'block';
            statusSuccess.style.display = 'none';

            // Start checking for session
            startSessionCheck();
        }

        function startSessionCheck() {
            if (checkingInterval) return;

            console.log('⏱️ Started session polling...');

            checkingInterval = setInterval(() => {
                checkSession();
            }, CHECK_INTERVAL);
        }

        function stopSessionCheck() {
            if (checkingInterval) {
                clearInterval(checkingInterval);
                checkingInterval = null;
                console.log('⏹️ Stopped session polling');
            }
        }

        async function checkSession() {
            try {
                // Try to get user info from API
                const response = await fetch(`${API_URL}/auth/me`, {
                    method: 'GET',
                    credentials: 'include', // Important: include cookies
                    headers: {
                        'Accept': 'application/json'
                    }
                });

                if (response.ok) {
                    const user = await response.json();
                    console.log('✅ Session valid:', user.email);
                    onSessionDetected(user);
                } else {
                    console.log('⏳ No active session yet (status:', response.status + ')');
                }
            } catch (error) {
                console.log('⚠️ Session check failed:', error.message);
            }
        }

        function onSessionDetected(user) {
            console.log('🎉 Session detected! Loading app...');

            stopSessionCheck();

            // Hide checking, show success
            statusChecking.style.display = 'none';
            statusSuccess.style.display = 'block';

            // Wait a moment then load app
            setTimeout(() => {
                loginScreen.style.display = 'none';
                appFrame.classList.add('active');
                console.log('✅ App loaded');
            }, 1500);
        }

        // Listen for messages from the browser (if opened in popup)
        window.addEventListener('message', (event) => {
            if (event.data && event.data.type === 'login_success') {
                console.log('📨 Received login success message');
                checkSession();
            }
        });

        // Expose functions for debugging
        window.checkSession = checkSession;
        window.resetApp = () => {
            loginScreen.style.display = 'flex';
            appFrame.classList.remove('active');
            statusChecking.style.display = 'none';
            statusSuccess.style.display = 'none';
            stopSessionCheck();
        };

        console.log('📝 Desktop app ready');
        console.log('💡 Debug: Call checkSession() or resetApp() in console');
    </script>
</body>

</html>
