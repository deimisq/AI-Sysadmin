<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Sysadmin Agent</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body,
        html {
            width: 100%;
            height: 100%;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }

        .container {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: white;
            border-radius: 20px;
            padding: 60px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            text-align: center;
            max-width: 500px;
        }

        .logo {
            width: 80px;
            height: 80px;
            margin: 0 auto 30px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100());
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
        }

        h1 {
            color: #2d3748;
            margin-bottom: 10px;
            font-size: 28px;
        }

        p {
            color: #718096;
            margin-bottom: 30px;
            line-height: 1.6;
        }

        .button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 16px 40px;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
            width: 100%;
        }

        .button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.6);
        }

        .button:active {
            transform: translateY(0);
        }

        .button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .status {
            margin-top: 20px;
            padding: 12px;
            border-radius: 8px;
            font-size: 14px;
            display: none;
        }

        .status.info {
            display: block;
            background: #e0e7ff;
            color: #3730a3;
        }

        .status.success {
            display: block;
            background: #d1fae5;
            color: #065f46;
        }

        .status.error {
            display: block;
            background: #fee2e2;
            color: #991b1b;
        }

        .spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid #cbd5e0;
            border-top-color: #667eea;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-right: 8px;
            vertical-align: middle;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        #app-frame {
            width: 100%;
            height: 100%;
            border: none;
            position: absolute;
            top: 0;
            left: 0;
            display: none;
        }

        #app-frame.active {
            display: block;
        }
    </style>
</head>

<body>
    <div class="container" id="login-screen">
        <div class="logo">🔐</div>
        <h1>Bienvenido a AI Sysadmin Agent</h1>
        <p>Para comenzar, necesitas iniciar sesión</p>
        <button class="button" id="login-btn" onclick="startLogin()">Iniciar Sesión</button>
        <div class="status info" id="status-info" style="display:none;">
            <span class="spinner"></span>
            <span id="status-text">Iniciando servidor OAuth...</span>
        </div>
        <div class="status success" id="status-success" style="display:none;">
            ✅ Sesión detectada! Cargando...
        </div>
        <div class="status error" id="status-error" style="display:none;">
            <span id="error-text"></span>
        </div>
    </div>

    <iframe id="app-frame" src="https://testing.sentrait.com.uy"></iframe>

    <script type="module">
        const { invoke } = window.__TAURI__.core;
        const { listen } = window.__TAURI__.event;
        const { open } = window.__TAURI__.shell;

        const LOGIN_URL = 'https://testing.sentrait.com.uy/login';
        const API_BASE = 'https://testing.sentrait.com.uy/api/v1';

        let oauthPort = null;
        let pollInterval = null;

        const loginBtn = document.getElementById('login-btn');
        const statusInfo = document.getElementById('status-info');
        const statusText = document.getElementById('status-text');
        const statusSuccess = document.getElementById('status-success');
        const statusError = document.getElementById('status-error');
        const errorText = document.getElementById('error-text');
        const loginScreen = document.getElementById('login-screen');
        const appFrame = document.getElementById('app-frame');

        console.log('🚀 Desktop app initialized');

        // Check for existing session on startup
        checkSession();

        async function startLogin() {
            try {
                loginBtn.disabled = true;
                showStatus('info', 'Iniciando servidor OAuth...');

                // Start OAuth server
                oauthPort = await invoke('start_oauth_server');
                console.log(`✅ OAuth server started on port ${oauthPort}`);

                // Build redirect URI
                const redirectUri = encodeURIComponent(`http://localhost:${oauthPort}`);

                // Open browser with login URL
                showStatus('info', 'Abriendo navegador...');
                await open(`${LOGIN_URL}?desktop=true&redirect_uri=${redirectUri}`);

                // Start polling for session
                showStatus('info', 'Esperando inicio de sesión...');
                startSessionPolling();

                // Listen for OAuth redirect
                await listen('oauth_redirect', (event) => {
                    console.log('📨 OAuth redirect received:', event.payload);
                    // Give backend a moment to set cookies
                    setTimeout(() => checkSession(), 1000);
                });

            } catch (error) {
                console.error('❌ Error:', error);
                showStatus('error', `Error:  ${error}`);
                loginBtn.disabled = false;
            }
        }

        function startSessionPolling() {
            // Poll every 2 seconds
            pollInterval = setInterval(() => {
                checkSession();
            }, 2000);
        }

        function stopSessionPolling() {
            if (pollInterval) {
                clearInterval(pollInterface);
                pollInterval = null;
            }
        }

        async function checkSession() {
            try {
                const response = await fetch(`${API_BASE}/auth/me`, {
                    credentials: 'include'
                });

                if (response.ok) {
                    const user = await response.json();
                    console.log('✅ Session valid:', user.email);
                    onSessionValid(user);
                }
            } catch (error) {
                console.log('⏳ Waiting for session...');
            }
        }

        function onSessionValid(user) {
            stopSessionPolling();
            showStatus('success', '');

            setTimeout(() => {
                loginScreen.style.display = 'none';
                appFrame.classList.add('active');
                console.log('✅ App loaded');
            }, 1500);
        }

        function showStatus(type, message) {
            // Hide all
            statusInfo.style.display = 'none';
            statusSuccess.style.display = 'none';
            statusError.style.display = 'none';

            // Show relevant
            if (type === 'info') {
                statusText.textContent = message;
                statusInfo.style.display = 'block';
            } else if (type === 'success') {
                statusSuccess.style.display = 'block';
            } else if (type === 'error') {
                errorText.textContent = message;
                statusError.style.display = 'block';
            }
        }

        console.log('📝 Ready');
    </script>
</body>

</html>
