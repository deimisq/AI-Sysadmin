<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Sysadmin Agent</title>
    <style>
        body,
        html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        #loader {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #0a0a0a;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            color: white;
            font-family: system-ui, -apple-system, sans-serif;
            z-index: 9999;
        }

        .spinner {
            width: 50px;
            height: 50px;
            border: 4px solid #333;
            border-top-color: #3b82f6;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        #loader p {
            margin-top: 20px;
            font-size: 14px;
            color: #888;
        }
    </style>
</head>

<body>
    <div id="loader">
        <div class="spinner"></div>
        <p>Cargando AI Sysadmin Agent...</p>
    </div>

    <iframe id="app-frame" src="https://testing.sentrait.com.uy"
        allow="clipboard-read; clipboard-write; fullscreen; geolocation; microphone; camera"
        onload="document.getElementById('loader').style.display='none';"></iframe>

    <script>
        console.log('🚀 Desktop App Initialized');
        console.log('Target URL:', 'https://testing.sentrait.com.uy');

        const iframe = document.getElementById('app-frame');
        const loader = document.getElementById('loader');

        // Track iframe load
        iframe.addEventListener('load', function () {
            console.log('✅ Iframe loaded successfully');
            loader.style.display = 'none';
        });

        // Track iframe errors
        iframe.addEventListener('error', function (e) {
            console.error('❌ Iframe failed to load:', e);
            loader.innerHTML = `
                <div style="text-align: center; max-width: 500px;">
                    <h2 style="color: #ef4444;">Error de Carga</h2>
                    <p>No se pudo cargar la aplicación</p>
                    <p style="font-size: 12px; color: #666;">
                        URL: https://testing.sentrait.com.uy
                    </p>
                    <p style="font-size: 12px; color: #666;">
                        Verifica tu conexión o que el servidor esté disponible
                    </p>
                    <button onclick="location.reload()" style="
                        margin-top: 20px;
                        padding: 10px 20px;
                        background: #3b82f6;
                        color: white;
                        border: none;
                        border-radius: 5px;
                        cursor: pointer;
                    ">Reintentar</button>
                </div>
            `;
        });

        // Hide loader after max 10 seconds
        setTimeout(() => {
            if (loader.style.display !== 'none') {
                console.warn('⚠️ Loader timeout - forcing hide');
                loader.style.display = 'none';

                // Check if iframe actually loaded
                try {
                    const iframeDoc = iframe.contentDocument || iframe.contentWindow.document;
                    if (!iframeDoc || iframeDoc.body.innerHTML === '') {
                        console.error('❌ Iframe appears empty');
                        loader.innerHTML = `
                            <div style="text-align: center; max-width: 500px;">
                                <h2 style="color: #f59e0b;">Carga Lenta</h2>
                                <p>La aplicación está tardando más de lo esperado</p>
                                <p style="font-size: 12px; color: #666;">
                                    Esto podría deberse a:
                                </p>
                                <ul style="text-align: left; font-size: 12px; color: #888;">
                                    <li>Conexión lenta a internet</li>
                                    <li>El servidor está ocupado</li>
                                    <li>Problemas de CORS o X-Frame-Options</li>
                                </ul>
                                <button onclick="location.reload()" style="
                                    margin-top: 20px;
                                    padding: 10px 20px;
                                    background: #3b82f6;
                                    color: white;
                                    border: none;
                                    border-radius: 5px;
                                    cursor: pointer;
                                ">Reintentar</button>
                            </div>
                        `;
                        loader.style.display = 'flex';
                    }
                } catch (e) {
                    console.log('ℹ️ Cannot access iframe content (normal for cross-origin)');
                }
            }
        }, 10000);

        // Detect if offline
        window.addEventListener('offline', () => {
            console.warn('📡 Connection lost');
            loader.innerHTML = `
                <div style="text-align: center;">
                    <h2>Sin Conexión</h2>
                    <p>No se puede conectar a testing.sentrait.com.uy</p>
                    <p>Verifica tu conexión a internet</p>
                </div>
            `;
            loader.style.display = 'flex';
        });

        window.addEventListener('online', () => {
            console.log('📡 Connection restored');
            location.reload();
        });

        // Log any console errors
        window.addEventListener('error', function (e) {
            console.error('Window error:', e.error);
        });

        console.log('📝 Debugging enabled - check console for details');
    </script>
</body>

</html>
