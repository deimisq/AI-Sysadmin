server {
    listen 8080;
    server_name agent.sentrait.com.uy;
    
    root /var/www/agent;
    index index.html;
    
    # Logs
    access_log /var/log/nginx/agent.sentrait.access.log;
    error_log /var/log/nginx/agent.sentrait.error.log;
    
    # Main location
    location / {
        try_files $uri $uri/ =404;
    }
    
    # Download file with proper headers
    location /ai-sysadmin-release.tar.gz {
        add_header Content-Type application/gzip;
        add_header Content-Disposition 'attachment; filename="ai-sysadmin-release.tar.gz"';
        add_header X-Content-Type-Options nosniff;
    }
    
    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    
    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
}
